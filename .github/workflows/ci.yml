# CI for the test program of spec 11 (tiers 0 to 6). Every job calls the same
# `go run ./tools/task <name>` entry points developers use locally, so the
# commands are defined once in tools/task.
#
# Nothing runs on its own: there is no cron schedule and no push or pull
# request trigger (design-notes 6). The workflow runs only when dispatched by
# hand from the Actions tab. Every dispatch runs static, unit, fuzz-short,
# integration, and openapi, the jobs that finish in minutes; ticking
# `nightly=true` adds the fault sweep, fuzz for 30 min per target, mutation
# testing, benchmarks with the benchstat gate, and the chaos matrix against
# the compose `chaos` profile.
name: ci

on:
  workflow_dispatch:
    inputs:
      nightly:
        description: "Also run the long tiers (fault sweep, fuzz 30m, mutate, bench, chaos matrix)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOTOOLCHAIN: local
  # Optional tools are installed in CI; a missing one is a failure, not a skip.
  TASK_REQUIRE_TOOLS: "1"

jobs:
  # ---------------------------------------------------------------- tier 0
  static:
    name: tier 0 static
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: go run ./tools/task fmt
      - name: go vet
        run: go vet ./...
      - name: staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - name: golangci-lint (v2, .golangci.yml)
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          # Build from source with the Go from go.mod: a prebuilt binary
          # compiled with an older Go refuses a module targeting a newer one
          # (v2.14.0 was verified to build and run with go1.27.0).
          install-mode: goinstall
          args: --timeout=10m

  # ---------------------------------------------------------------- tier 1
  unit:
    name: tier 1 unit (race, shuffle, count=2) and coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go test
        run: go test -race -shuffle=on -count=2 ./...
      - name: coverage profile and covergate
        run: go run ./tools/task cover
      - name: coverage summary
        if: always()
        run: |
          if [ -f coverage/summary.md ]; then cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
      - name: test-to-code ratio (reported, not gated; spec 11.8)
        if: always()
        run: |
          prod=$(find mediator -name '*.go' ! -name '*_test.go' -exec cat {} + | wc -l)
          test=$(find mediator -name '*_test.go' -exec cat {} + | wc -l)
          echo "### Test-to-code ratio" >> "$GITHUB_STEP_SUMMARY"
          echo "mediator/...: ${test} test lines / ${prod} production lines" >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------- tier 2
  fuzz-short:
    name: tier 2 fuzz (30s per target)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: fuzz every target
        run: go run ./tools/task fuzz -fuzztime 30s
      - name: upload new crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashers
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore

  # ---------------------------------------------------------------- tier 4
  integration:
    name: tier 4 integration (testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: pull images
        run: docker pull postgres:18 && docker pull redis:8
      - name: go test -tags integration
        run: go run ./tools/task test-integration

  # ---------------------------------------------------------------- tier 3
  sweep:
    name: tier 3 fault sweep
    # On demand, like the other long tiers: the full matrix takes most of an
    # hour, which is not worth waiting for on every push (design-notes 6).
    if: github.event_name == 'workflow_dispatch' && inputs.nightly
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: start Postgres and Redis
        run: go run ./tools/task up
      - name: go test -tags faultsweep,faultinject
        run: go run ./tools/task test-sweep
        env:
          PG_URL: postgres://app:app@localhost:5432/app
          REDIS_ADDR: localhost:6379
      - name: compose logs
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --no-color --tail=200
      - name: stop the stack
        if: always()
        run: go run ./tools/task down

  # ------------------------------------------------------- openapi (M4 gate)
  openapi:
    name: openapi drift and TypeScript client
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: api/openapi.json matches a fresh export
        run: go run ./tools/task openapi-check
      - name: generate and type-check the TypeScript client (Node 22 container)
        run: |
          docker run --rm -v "$PWD/api:/work/api:ro" -w /work node:22 sh -ec '
            npx --yes openapi-typescript api/openapi.json -o /tmp/api.d.ts
            npx --yes -p typescript tsc --noEmit /tmp/api.d.ts
          '

  # ------------------------------------------- long tiers, manual dispatch only
  nightly-fuzz:
    name: long fuzz (30m per target)
    if: github.event_name == 'workflow_dispatch' && inputs.nightly
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: fuzz every target for 30 minutes
        run: go run ./tools/task fuzz -fuzztime 30m
      - name: upload new crashers
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-fuzz-crashers
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore

  nightly-mutate:
    name: mutation testing (gremlins, efficacy >= 95)
    if: github.event_name == 'workflow_dispatch' && inputs.nightly
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@latest
      - name: gremlins unleash ./mediator
        run: go run ./tools/task mutate

  nightly-bench:
    name: benchmarks (benchstat gate, 10% on the median)
    if: github.event_name == 'workflow_dispatch' && inputs.nightly
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest
      - name: restore the previous baseline
        uses: actions/cache/restore@v4
        with:
          path: coverage/bench-baseline.txt
          key: bench-baseline-${{ github.sha }}
          restore-keys: bench-baseline-
      - name: bench and compare against the baseline
        run: go run ./tools/task bench
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench
          path: coverage/bench*.txt
          if-no-files-found: ignore
      - name: store this run as the new baseline
        run: go run ./tools/task bench-baseline
      - name: save the baseline
        uses: actions/cache/save@v4
        with:
          path: coverage/bench-baseline.txt
          key: bench-baseline-${{ github.sha }}

  nightly-chaos:
    name: chaos ${{ matrix.workload }} (seeds 1-3, 20m each)
    if: github.event_name == 'workflow_dispatch' && inputs.nightly
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        workload:
          - register
          - register-cached
          - bank
          - bank-idempotent
          - idempotent-append
          - events
          - cache-staleness
          - remote-send
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build and start the chaos profile (Postgres, Redis, Toxiproxy, node1..node3)
        run: go run ./tools/task chaos-up
      - name: chaos matrix for this workload
        run: go run ./tools/task chaos-matrix
        env:
          CHAOS_WORKLOADS: ${{ matrix.workload }}
          CHAOS_SEEDS: "1,2,3"
          CHAOS_DURATION: 20m
      - name: collect node logs
        if: always()
        run: |
          mkdir -p test/chaos/runs
          docker compose -f deploy/docker-compose.yml --profile chaos logs --no-color > test/chaos/runs/compose.log || true
      - name: upload run directories (histories, nemesis logs, porcupine.html)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaos-${{ matrix.workload }}
          path: test/chaos/runs/
          if-no-files-found: ignore
      - name: stop the stack
        if: always()
        run: go run ./tools/task chaos-down
