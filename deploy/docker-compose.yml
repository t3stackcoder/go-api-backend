# Local stack (spec 12.1). Without profiles: Postgres and Redis only
# (`go run ./tools/task up`). Profile `chaos` adds Toxiproxy and the chaos
# nodes, which are built from deploy/Dockerfile target `chaosnode`
# (`go run ./tools/task chaos-up`). Every node reaches Postgres and Redis only
# through its own Toxiproxy listeners (deploy/toxiproxy.json) so faults can be
# injected per node, per service, and per direction.
name: go-api-backend

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    command:
      - postgres
      - -c
      - max_connections=300
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=200ms
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql   # 18+ images mount here; /var/lib/postgresql/data fails at start
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:8
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
      - --save
      - ""
    ports: ["6379:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  toxiproxy:
    profiles: [chaos]
    image: ghcr.io/shopify/toxiproxy:2.12.0
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    volumes:
      - ./toxiproxy.json:/config/toxiproxy.json:ro
    ports:
      - "8474:8474"          # API
      - "15432-15436:15432-15436"   # per-node Postgres listeners
      - "16379-16383:16379-16383"   # per-node Redis listeners
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }

  node1: &node
    profiles: [chaos]
    build: { context: .., dockerfile: deploy/Dockerfile, target: chaosnode }
    environment:
      NODE_ID: node1
      PG_URL: postgres://app:app@toxiproxy:15432/app
      REDIS_ADDR: toxiproxy:16379
      HTTP_ADDR: :8080
    ports: ["18081:8080"]
    depends_on: [toxiproxy]
    stop_grace_period: 20s

  node2:
    <<: *node
    environment:
      NODE_ID: node2
      PG_URL: postgres://app:app@toxiproxy:15433/app
      REDIS_ADDR: toxiproxy:16380
      HTTP_ADDR: :8080
    ports: ["18082:8080"]

  node3:
    <<: *node
    environment:
      NODE_ID: node3
      PG_URL: postgres://app:app@toxiproxy:15434/app
      REDIS_ADDR: toxiproxy:16381
      HTTP_ADDR: :8080
    ports: ["18083:8080"]

volumes:
  pgdata:
  redisdata:
